# Publishes an `ens` release and the seed the tree bootstraps from: the same binary, one per host.
# Dispatch only. A seed is refreshed when the sources outgrow it, which is an occasional deliberate
# act and not something a push should trigger.
#
# The tag is the version with a leading v, whether or not the input already wrote it. Seeds are
# cached by tag.
#
# The version is written into the tree here, not by a person: every job applies the same edit to
# the dispatched commit, and the draft job commits it as `Release vX` and tags that commit, so the
# tag rebuilds the binaries from source alone. Each build checks its tree is the one the tag holds.
#
# The release is created as a draft first and each host uploads straight into it, instead of passing
# through the artifact store.
#
# A host the pin names no seed for yet gets its first one through `first_seed_host`. Seeds are not
# cross-compiled, so only a stage 1 is: the linux-x64 seed builds this tree's compiler, which emits
# the driver's objects for that host, and the host links them into the stage 1 its suite then
# bootstraps from. What the release publishes for it is the stage 2 that host builds natively, as
# for every other host.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, with or without the leading "v"
        required: true
      dry_run:
        description: Dry run. Build, test and hash on every host without publishing
        type: boolean
        default: false
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false
      first_seed_host:
        description: A host seed/seed.json pins no seed for yet, such as windows-arm64, whose first seed this run makes
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

env:
  TAG: ${{ startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version) }}

concurrency:
  group: release-${{ startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version) }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      tree: ${{ steps.release-commit.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'

      - name: Write the version
        run: xmake l scripts/set_version.lua "${TAG#v}"

      # authored by whoever dispatched the release, so the history shows who cut it.
      - name: Commit the release
        id: release-commit
        run: |
          git -c user.name="${{ github.actor }}" \
            -c user.email="${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com" \
            commit --allow-empty -am "Release ${{ env.TAG }}"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Tag the release and open a draft
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "${{ env.TAG }}"
          git push origin "refs/tags/${{ env.TAG }}"
          flags=(--draft --verify-tag --title "${{ env.TAG }}" --generate-notes)
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "${{ env.TAG }}" "${flags[@]}"

  # The driver's objects for the host that gets its first seed, emitted by the compiler this tree
  # builds on linux-x64 and linked on that host. The build stops before the link, since nothing here
  # can link for another system.
  first-seed-objects:
    needs: draft
    if: ${{ inputs.first_seed_host != '' }}
    runs-on: ubuntu-22.04
    env:
      XMAKE_VERSION: '3.1.1'
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
          actions-cache-folder: .xmake-install
          actions-cache-key: linux-x64-${{ env.XMAKE_VERSION }}

      # the edit the draft job committed, so this host builds the tree the tag holds.
      - name: Write the version
        shell: bash
        run: |
          xmake l scripts/set_version.lua "${TAG#v}"
          git add selfhost/build/src/version.ens
          test "$(git write-tree)" = "${{ needs.draft.outputs.tree }}" || {
            echo "this tree is not the one the release commit holds"; exit 1; }

      - name: Resolve the cache key and the package folder
        id: packages
        shell: bash
        run: |
          folder="$(xmake l -c 'import("core.base.global"); print(global.directory())' | tr -d '\r')"
          echo "folder=${folder}/packages" >> "$GITHUB_OUTPUT"
          grep -E '^\s*add_requires' xmake.lua > requires.txt
          key="$(xmake l -c "print(hash.sha256('requires.txt'))" | tr -d '\r\n' | cut -c1-16)"
          test -n "$key" || { echo "could not hash the add_requires lines"; exit 1; }
          echo "key=packages-linux-x64-${key}" >> "$GITHUB_OUTPUT"
          rm requires.txt

      - name: Restore the LLVM packages
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.packages.outputs.folder }}
          key: ${{ steps.packages.outputs.key }}

      - name: Cache the bootstrap seed
        uses: actions/cache@v4
        with:
          path: ~/.ens/seeds
          key: seeds-linux-x64-${{ hashFiles('seed/seed.json') }}

      - name: Install the LLVM build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils-dev zlib1g-dev libzstd-dev libedit-dev libffi-dev libxml2-dev pkg-config

      - name: Resolve packages
        run: xmake f -y -m release -p linux -a x64

      - name: Put the LLVM package on PATH
        shell: bash
        run: |
          clang="$(find "${{ steps.packages.outputs.folder }}/l/llvm" \
            \( -type f -o -type l \) -name 'clang++' -print -quit)"
          test -n "$clang" || { echo "no clang++ in the llvm package"; exit 1; }
          dirname "$clang" >> "$GITHUB_PATH"

      - name: Configure
        run: xmake f -c -y -m release -p linux -a x64

      - name: Build the native archive
        run: xmake build ens-llvm

      # the suite builds build/host/ens out of this tree from the pinned linux-x64 seed before any
      # job starts, and one quick job is all that needs to run after it.
      - name: Build this tree's compiler
        run: xmake test hello

      - name: Emit the driver for the new host
        shell: bash
        run: |
          case "${{ inputs.first_seed_host }}" in
            linux-x64) triple=x86_64-unknown-linux-gnu ;;
            linux-arm64) triple=aarch64-unknown-linux-gnu ;;
            windows-x64) triple=x86_64-pc-windows-msvc ;;
            windows-arm64) triple=aarch64-pc-windows-msvc ;;
            *) echo "no target triple is known for '${{ inputs.first_seed_host }}'"; exit 1 ;;
          esac
          build/host/ens build selfhost/driver --target "$triple" --stdlib libs --no-link \
            --objects first-seed-objects

      - uses: actions/upload-artifact@v4
        with:
          name: first-seed-objects
          path: first-seed-objects/
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [draft, first-seed-objects]
    if: ${{ !cancelled() && needs.draft.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.first-seed-objects.result) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, host: windows-x64,  plat: windows, arch: x64,   suffix: .exe }
          - { os: windows-11-arm, host: windows-arm64, plat: windows, arch: arm64, suffix: .exe }
          - { os: ubuntu-22.04, host: linux-x64,    plat: linux,   arch: x64,   suffix: '' }
          - { os: ubuntu-22.04-arm, host: linux-arm64, plat: linux, arch: arm64, suffix: '' }
          - { os: macos-15,     host: macos-arm64,  plat: macosx,  arch: arm64, suffix: '' }
    runs-on: ${{ matrix.os }}
    env:
      XMAKE_VERSION: '3.1.1'
      # hosts whose LLVM packages are not cached, by matrix.host; empty caches every host.
      PACKAGE_CACHE_SKIP: ''
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
          actions-cache-folder: .xmake-install
          actions-cache-key: ${{ matrix.host }}-${{ env.XMAKE_VERSION }}

      # the edit the draft job committed, so this host builds the tree the tag holds.
      - name: Write the version
        shell: bash
        run: |
          xmake l scripts/set_version.lua "${TAG#v}"
          git add selfhost/build/src/version.ens
          test "$(git write-tree)" = "${{ needs.draft.outputs.tree }}" || {
            echo "this tree is not the one the release commit holds"; exit 1; }

      # The key covers the add_requires lines only to prevent rebuilding LLVM from source for unrelated changes.
      - name: Resolve the cache key and the package folder
        id: packages
        shell: bash
        run: |
          folder="$(xmake l -c 'import("core.base.global"); print(global.directory())' | tr -d '\r')"
          echo "folder=${folder}/packages" >> "$GITHUB_OUTPUT"
          grep -E '^\s*add_requires' xmake.lua > requires.txt
          key="$(xmake l -c "print(hash.sha256('requires.txt'))" | tr -d '\r\n' | cut -c1-16)"
          test -n "$key" || { echo "could not hash the add_requires lines"; exit 1; }
          echo "key=packages-${{ matrix.host }}-${key}" >> "$GITHUB_OUTPUT"
          rm requires.txt

      - name: Restore the LLVM packages
        if: ${{ !contains(env.PACKAGE_CACHE_SKIP, matrix.host) }}
        id: packages-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.packages.outputs.folder }}
          key: ${{ steps.packages.outputs.key }}

      - name: Cache the bootstrap seed
        uses: actions/cache@v4
        with:
          path: ~/.ens/seeds
          key: seeds-${{ matrix.host }}-${{ hashFiles('seed/seed.json') }}

      - name: Install the LLVM build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils-dev zlib1g-dev libzstd-dev libedit-dev libffi-dev libxml2-dev pkg-config

      - name: Resolve packages
        run: xmake f -y -m release -p ${{ matrix.plat }} -a ${{ matrix.arch }}

      - name: Put the LLVM package on PATH
        shell: bash
        run: |
          clang="$(find "${{ steps.packages.outputs.folder }}/l/llvm" \
            \( -type f -o -type l \) \
            \( -name 'clang++' -o -name 'clang++.exe' \) -print -quit)"
          test -n "$clang" || { echo "no clang++ in the llvm package"; exit 1; }
          dirname "$clang" >> "$GITHUB_PATH"

      - name: Configure
        run: xmake f -c -y -m release -p ${{ matrix.plat }} -a ${{ matrix.arch }}

      - name: Build the native archive
        run: xmake build ens-llvm

      - name: Fetch the objects of the first seed
        if: ${{ matrix.host == inputs.first_seed_host }}
        uses: actions/download-artifact@v4
        with:
          name: first-seed-objects
          path: first-seed-objects

      # stage 1: the driver objects linked here the way ens links a program of its own kind,
      # against this host's native archive: on Linux through the C compiler, and on Windows
      # through the LLVM package's lld-link, against Visual Studio's static C runtime from the
      # folders the MSVC toolchain names, as ens.exe itself is linked. ENS_SEEDS then hands it to
      # the suite as the seed for the tag the pin names, which is how a host with no pinned seed
      # bootstraps.
      - name: Link the first seed
        if: ${{ matrix.host == inputs.first_seed_host }}
        shell: bash
        run: |
          archive="$(find build \( -name 'libens-llvm.a' -o -name 'ens-llvm.lib' \) -print -quit)"
          test -n "$archive" || { echo "no ens-llvm archive to link with"; exit 1; }
          seeds="$RUNNER_TEMP/first-seed"
          tag="$(jq -r .tag seed/seed.json)"
          mkdir -p "$seeds/$tag"
          if [ "${{ runner.os }}" = Windows ]; then
            lld="$(find "${{ steps.packages.outputs.folder }}/l/llvm" \
              \( -type f -o -type l \) -name 'lld-link.exe' -print -quit)"
            test -n "$lld" || { echo "no lld-link in the llvm package"; exit 1; }
            lib="$(xmake l -c 'import("core.tool.toolchain"); print(toolchain.load("msvc", {plat = "windows", arch = "${{ matrix.arch }}"}):runenvs().LIB)' | tr -d '\r')"
            test -n "$lib" || { echo "the MSVC toolchain names no library folders"; exit 1; }
            folders=()
            IFS=';' read -ra parts <<<"$lib"
            for part in "${parts[@]}"; do
              test -n "$part" && folders+=("-libpath:$part")
            done
            # the options are spelled with dashes, which lld-link reads like slashes and which
            # Git's bash leaves alone, where it turns '/nologo' into a path under its own folder
            "$lld" -nologo -lldignoreenv -subsystem:console -Brepro "${folders[@]}" \
              first-seed-objects/*.obj "$archive" "-out:$seeds/$tag/ens.exe" \
              -defaultlib:libcmt -defaultlib:oldnames -defaultlib:kernel32 \
              psapi.lib shell32.lib ole32.lib uuid.lib advapi32.lib ws2_32.lib ntdll.lib \
              version.lib wsock32.lib bcrypt.lib
          else
            cc -no-pie -o "$seeds/$tag/ens" first-seed-objects/*.o \
              "$archive" -lm -lpthread -ldl -lgcc_s
          fi
          echo "ENS_SEEDS=$seeds" >> "$GITHUB_ENV"

      # a release is only ever cut from a tree that is green on the host it is cut for. This also
      # leaves the bootstrap stages behind, which is where the published binary comes from.
      - name: Test
        run: xmake test

      # stage 2 of the bootstrap gate: built by build/host/ens out of this tree, so nothing the seed
      # decided reaches it, and already proven to emit the same modules as stage 3. It is taken
      # rather than rebuilt because linking `ens` needs the link environment the harness
      # constructs, and reconstructing that here would duplicate it.
      - name: Stage the release compiler
        shell: bash
        run: |
          stage2="build/bootstrap/stage2/ens${{ matrix.suffix }}"
          test -f "$stage2" || { echo "no $stage2: did the bootstrap job run?"; exit 1; }
          mkdir -p dist
          cp "$stage2" "dist/ens-${{ matrix.host }}${{ matrix.suffix }}"

      - name: Hash
        id: digest
        shell: bash
        run: |
          cd dist
          name="ens-${{ matrix.host }}${{ matrix.suffix }}"
          digest="$(xmake l -c "print(hash.sha256('${name}'))" | tr -d '\r\n')"
          test -n "$digest" || { echo "could not hash ${name}"; exit 1; }
          printf '%s' "$digest" > "${name}.sha256"
          echo "${name} ${digest}"

      - name: Upload to the release
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ env.TAG }}" \
            "dist/ens-${{ matrix.host }}${{ matrix.suffix }}" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.host }}
          path: dist/*.sha256

      - name: Report a failed package build
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          echo "=== disk ==="
          df -h
          echo "=== memory ==="
          free -h 2>/dev/null || vm_stat 2>/dev/null | head -8 || true
          echo "=== was anything killed by the kernel? ==="
          if command -v dmesg >/dev/null 2>&1; then
            sudo dmesg 2>/dev/null | grep -iE 'killed process|out of memory|oom-kill' | tail -20 \
              || echo "(no OOM records in dmesg)"
          else
            echo "(no dmesg on this host)"
          fi
          echo
          echo "=== failed package logs (in full) ==="
          logs=("$HOME"/.xmake/cache/packages/*/*/*/*/installdir.failed/logs/*.txt)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "(none: the failure was not a package build)"
          fi
          for log in "${logs[@]}"; do
            echo "----- $log : $(wc -l < "$log") lines -----"
            cat "$log"
            echo "----- end of $log -----"
          done

      - name: Upload the failed package logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-logs-${{ matrix.host }}
          path: ~/.xmake/cache/packages/*/*/*/*/installdir.failed/logs/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Save the LLVM packages
        if: ${{ !cancelled() && !contains(env.PACKAGE_CACHE_SKIP, matrix.host)
          && steps.packages-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.packages.outputs.folder }}
          key: ${{ steps.packages.outputs.key }}

  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # the release commit, which the pull request below carries along with the new pin. The
      # checkout keeps the token the branch is pushed with.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && github.sha || env.TAG }}
          token: ${{ secrets.SEED_PR_TOKEN || github.token }}
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Rewrite the seed pin
        shell: bash
        run: |
          shopt -s nullglob
          hosts='{}'
          for file in "${{ runner.temp }}"/digests/*.sha256; do
            host="$(basename "$file" .sha256)"
            host="${host#ens-}"
            host="${host%.exe}"
            hosts="$(jq --arg h "$host" --arg s "$(cat "$file")" '.[$h] = $s' <<<"$hosts")"
          done
          # every host is refreshed together.
          expected='["linux-arm64","linux-x64","macos-arm64","windows-arm64","windows-x64"]'
          found="$(jq -c 'keys' <<<"$hosts")"
          test "$found" = "$expected" || {
            echo "the digests name $found, expected $expected"; exit 1; }
          jq -n --sort-keys \
            --arg tag "${{ env.TAG }}" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download" \
            --argjson hosts "$hosts" \
            '{tag: $tag, url: $url, hosts: $hosts}' > seed/seed.json
          cat seed/seed.json

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ env.TAG }}" --draft=false

      # the pin lands as a pull request, not a push: the suite has to run against the new seed on
      # every host before it becomes what the tree bootstraps from. Building the seed proved it can
      # rebuild the commit it came from, which is necessary but not enough.
      #
      # The branch is the tagged release commit with the pin committed on top, so merging it brings
      # the version the release wrote into the branch it was dispatched from.
      #
      # A pull request opened with GITHUB_TOKEN does not trigger another workflow,
      # use a custom SEED_PR_TOKEN instead.
      - name: Open the pull request that moves the pin
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.SEED_PR_TOKEN || github.token }}
        run: |
          branch="seed/${{ env.TAG }}"
          title="Update the bootstrap binaries to ${{ env.TAG }}"
          git switch -c "$branch"
          git add seed/seed.json
          git -c user.name="${{ github.actor }}" \
            -c user.email="${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com" \
            commit -m "$title"
          git push origin "$branch"
          body="$(cat <<EOF
          This pull request has two commits:

          - \`Release ${{ env.TAG }}\` sets the version to \`${TAG#v}\`. The ${{ env.TAG }} release was built from it on every host.
          - \`$title\` points \`seed/seed.json\` at that release, so the suite bootstraps from it.

          Merge it with a merge commit, so the release commit stays in the history.
          EOF
          )"
          gh pr create --base "${{ github.ref_name }}" --head "$branch" --title "$title" \
            --body "$body"

  # Cleanup in case of failure: only a draft is deleted, together with the tag it was opened on,
  # which no pin can name yet.
  cleanup:
    needs: [draft, first-seed-objects, build, publish]
    if: ${{ (failure() || cancelled()) && !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Remove the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ env.TAG }}"
          draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft \
            --jq .isDraft 2>/dev/null || echo absent)"
          case "$draft" in
            true)  echo "removing the draft $tag and its tag"
                   gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag ;;
            false) echo "$tag is already published, leaving it" ;;
            *)     echo "there is no $tag release to remove"
                   gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" 2>/dev/null \
                     && echo "removed the tag $tag, which no release was opened on" || true ;;
          esac
