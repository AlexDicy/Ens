# Runs the suite on every host, on every push and pull request, then proves that any host builds
# for any other: each host builds the same programs for all five targets with nothing of its own
# reachable, every target's bytes have to be the same from every host, and each target's own
# machine runs them.
#
# The nightly schedule prevents cache eviction after 7 days without a read, a cold cache
# on Linux or macOS means building LLVM from source.
name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: test-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # the fixtures every host builds for every target, each pinning its exit code, its standard
  # output and what its standard error has to hold, so the cross-platform job can check a run.
  CROSS_PLATFORM_PROGRAMS: hello exc_main_unhandled process_spawn_merged_stream fs_round_trip

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, host: windows-x64,  plat: windows, arch: x64,   suffix: .exe }
          - { os: windows-11-arm, host: windows-arm64, plat: windows, arch: arm64, suffix: .exe }
          - { os: ubuntu-22.04, host: linux-x64,    plat: linux,   arch: x64,   suffix: '' }
          - { os: ubuntu-22.04-arm, host: linux-arm64, plat: linux, arch: arm64, suffix: '' }
          - { os: macos-15,     host: macos-arm64,  plat: macosx,  arch: arm64, suffix: '' }
    runs-on: ${{ matrix.os }}
    env:
      XMAKE_VERSION: '3.1.1'
      # hosts whose LLVM packages are not cached, by matrix.host; empty caches every host.
      PACKAGE_CACHE_SKIP: ''
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
          actions-cache-folder: .xmake-install
          actions-cache-key: ${{ matrix.host }}-${{ env.XMAKE_VERSION }}

      # The key covers the add_requires and add_requireconfs lines only, so an unrelated change does not rebuild LLVM from source.
      - name: Resolve the cache key and the package folder
        id: packages
        shell: bash
        run: |
          folder="$(xmake l -c 'import("core.base.global"); print(global.directory())' | tr -d '\r')"
          echo "folder=${folder}/packages" >> "$GITHUB_OUTPUT"
          grep -E '^\s*add_require' xmake.lua > requires.txt
          key="$(xmake l -c "print(hash.sha256('requires.txt'))" | tr -d '\r\n' | cut -c1-16)"
          test -n "$key" || { echo "could not hash the add_require lines"; exit 1; }
          echo "key=packages-${{ matrix.host }}-${key}" >> "$GITHUB_OUTPUT"
          rm requires.txt

      - name: Restore the LLVM packages
        if: ${{ !contains(env.PACKAGE_CACHE_SKIP, matrix.host) }}
        id: packages-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.packages.outputs.folder }}
          key: ${{ steps.packages.outputs.key }}

      - name: Cache the bootstrap seed
        uses: actions/cache@v4
        with:
          path: ~/.ens/seeds
          key: seeds-${{ matrix.host }}-${{ hashFiles('seed/seed.json') }}

      - name: Install the LLVM build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils-dev zlib1g-dev libzstd-dev libedit-dev libffi-dev libxml2-dev pkg-config

      - name: Resolve packages
        run: xmake f -y -m release -p ${{ matrix.plat }} -a ${{ matrix.arch }}

      # the LLVM package's bin folder has to be on PATH before the configure that sticks, or the
      # linker resolves to MSVC link.exe, -lLLVMCGData is ignored and CGData symbols go unresolved.
      # That choice is written into the config, so a later fix to PATH alone does not undo it.
      - name: Put the LLVM package on PATH
        shell: bash
        run: |
          clang="$(find "${{ steps.packages.outputs.folder }}/l/llvm" \
            \( -type f -o -type l \) \
            \( -name 'clang++' -o -name 'clang++.exe' \) -print -quit)"
          test -n "$clang" || { echo "no clang++ in the llvm package"; exit 1; }
          dirname "$clang" >> "$GITHUB_PATH"

      - name: Configure
        run: xmake f -c -y -m release -p ${{ matrix.plat }} -a ${{ matrix.arch }}

      # xmake test builds it itself when it is missing, but doing it here keeps a failure to build
      # it separate from a failure in the suite.
      - name: Build the native archive
        run: xmake build ens-llvm

      - name: Test
        run: xmake test

      # The programs the cross-platform job compares and runs, built for all five targets by the
      # compiler this tree built, with nothing of this machine's reachable: on Linux inside a bare
      # Debian image that has no C compiler, and on macOS and Windows under an environment emptied
      # of all but what the system itself needs, so no SDK, no developer folder and no LIB.
      - name: Build for every target with nothing of this machine's
        shell: bash
        run: |
          compiler="build/bootstrap/stage2/ens${{ matrix.suffix }}"
          test -f "$compiler" || { echo "no $compiler: did the bootstrap job run?"; exit 1; }
          out=build/crossplatform
          mkdir -p "$out" "$RUNNER_TEMP/clean-home"
          case "${{ runner.os }}" in
            Linux)
              docker pull -q debian:stable-slim
              clean() {
                docker run --rm -v "$PWD:/work" -w /work -e HOME=/tmp/home -e ENS_CACHE=/tmp/cache \
                  debian:stable-slim "$@"
              }
              ;;
            macOS)
              clean() {
                env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/clean-home" DEVELOPER_DIR=/nonexistent \
                  ENS_CACHE="$RUNNER_TEMP/clean-cache" "$@"
              }
              ;;
            Windows)
              system="$(cygpath -u "$SYSTEMROOT")"
              clean() {
                env -i SystemRoot="$SYSTEMROOT" PATH="$system/System32:$system" \
                  TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP" USERPROFILE="$RUNNER_TEMP/clean-home" \
                  ENS_CACHE="$RUNNER_TEMP/clean-cache" "$@"
              }
              ;;
          esac
          for target in macos-arm64=aarch64-apple-macos linux-x64=x86_64-unknown-linux-gnu \
              linux-arm64=aarch64-unknown-linux-gnu windows-x64=x86_64-pc-windows-msvc \
              windows-arm64=aarch64-pc-windows-msvc; do
            name="${target%%=*}"
            suffix=''
            case "$name" in windows-*) suffix=.exe ;; esac
            for program in $CROSS_PLATFORM_PROGRAMS; do
              clean "$compiler" build "tests/$program.ens" --target "${target#*=}" \
                --output "$out/$program-$name$suffix"
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: programs-${{ matrix.host }}
          path: build/crossplatform/
          if-no-files-found: error
          retention-days: 1

      - name: Report a failed package build
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          echo "=== disk ==="
          df -h
          echo "=== memory ==="
          free -h 2>/dev/null || vm_stat 2>/dev/null | head -8 || true
          # a package log that ends mid-compile with no diagnostic means the build was killed
          # rather than failed, and the kernel is the only place that records why.
          echo "=== was anything killed by the kernel? ==="
          if command -v dmesg >/dev/null 2>&1; then
            sudo dmesg 2>/dev/null | grep -iE 'killed process|out of memory|oom-kill' | tail -20 \
              || echo "(no OOM records in dmesg)"
          else
            echo "(no dmesg on this host)"
          fi
          echo
          echo "=== failed package logs (in full) ==="
          logs=("$HOME"/.xmake/cache/packages/*/*/*/*/installdir.failed/logs/*.txt)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "(none: the failure was not a package build)"
          fi
          for log in "${logs[@]}"; do
            echo "----- $log : $(wc -l < "$log") lines -----"
            cat "$log"
            echo "----- end of $log -----"
          done

      - name: Upload the failed package logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-logs-${{ matrix.host }}
          path: ~/.xmake/cache/packages/*/*/*/*/installdir.failed/logs/**
          if-no-files-found: ignore
          retention-days: 7

      # Temporary: links the stage 2 objects with the LLVM package's own lld-link, twice per
      # variant, to find which linker step makes the Windows x64 link differ between runs.
      - name: Link the stage 2 objects with lld-link under several options
        if: ${{ always() && runner.os == 'Windows' }}
        shell: bash
        run: |
          shopt -s nullglob
          objects=(build/bootstrap/stage2/*.obj)
          test ${#objects[@]} -gt 0 || { echo "no stage 2 objects"; exit 0; }
          archive="$(find build -name 'ens-llvm.lib' -print -quit)"
          lld="$(find "${{ steps.packages.outputs.folder }}/l/llvm" \( -type f -o -type l \) -name 'lld-link.exe' -print -quit)"
          lib="$(xmake l -c 'import("core.tool.toolchain"); print(toolchain.load("msvc", {plat = "windows", arch = "${{ matrix.arch }}"}):runenvs().LIB)' | tr -d '\r')"
          folders=(); IFS=';' read -ra parts <<<"$lib"; for part in "${parts[@]}"; do test -n "$part" && folders+=("-libpath:$part"); done
          link() {
            local out="$1"; shift
            "$lld" -nologo -lldignoreenv -subsystem:console -Brepro "${folders[@]}" "${objects[@]}" "$archive" \
              "-out:$out" -defaultlib:libcmt -defaultlib:oldnames -defaultlib:kernel32 \
              psapi.lib shell32.lib ole32.lib uuid.lib advapi32.lib ws2_32.lib ntdll.lib version.lib wsock32.lib bcrypt.lib "$@"
          }
          mkdir -p build/relink
          for variant in "default:" "noicf:-opt:noicf" "onethread:-threads:1" "noref:-opt:noref,noicf"; do
            name="${variant%%:*}"; flags="${variant#*:}"
            for run in 1 2 3; do
              link "build/relink/$name-$run.exe" $flags
            done
            echo "== $name"; sha256sum build/relink/$name-*.exe | awk '{print substr($1, 1, 16), $2}'
          done

      # the two compilers the bootstrap gate compared, for reading when they differ
      - name: Upload the bootstrap stages
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-stages-${{ matrix.host }}
          path: |
            build/bootstrap/stage2/ens
            build/bootstrap/stage2/ens.exe
            build/bootstrap/stage3/ens
            build/bootstrap/stage3/ens.exe
            build/bootstrap/stage3-again/ens
            build/bootstrap/stage3-again/ens.exe
          if-no-files-found: ignore
          retention-days: 3

      - name: Save the LLVM packages
        if: ${{ !cancelled() && !contains(env.PACKAGE_CACHE_SKIP, matrix.host)
          && steps.packages-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.packages.outputs.folder }}
          key: ${{ steps.packages.outputs.key }}

  # One job per target, on that target's own machine: the programs every host built for it have
  # to be the same bytes, which is what shows a link takes nothing from the host, and each has to
  # run as its fixture's header pins.
  cross-platform:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, target: windows-x64, suffix: .exe }
          - { os: windows-11-arm, target: windows-arm64, suffix: .exe }
          - { os: ubuntu-22.04, target: linux-x64, suffix: '' }
          - { os: ubuntu-22.04-arm, target: linux-arm64, suffix: '' }
          - { os: macos-15, target: macos-arm64, suffix: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: programs-*
          path: programs

      - name: Compare the bytes every host built
        shell: bash
        run: |
          status=0
          hosts=(programs/programs-*)
          for program in $CROSS_PLATFORM_PROGRAMS; do
            file="$program-${{ matrix.target }}${{ matrix.suffix }}"
            first="${hosts[0]}/$file"
            for host in "${hosts[@]}"; do
              built="$host/$file"
              if [ ! -f "$built" ]; then
                echo "$file was not built on ${host#programs/programs-}"
                status=1
              elif ! cmp -s "$first" "$built"; then
                echo "$file differs between ${hosts[0]#programs/programs-} and ${host#programs/programs-}:"
                cmp "$first" "$built" || true
                status=1
              fi
            done
          done
          test $status -eq 0 && echo "every host built the same bytes for ${{ matrix.target }}"
          exit $status

      # the header of each fixture pins its exit code, its exact standard output and the
      # fragments its standard error has to hold; a fixture carrying any other directive is
      # refused here rather than half-checked.
      - name: Run them
        shell: bash
        run: |
          status=0
          for program in $CROSS_PLATFORM_PROGRAMS; do
            source="tests/$program.ens"
            if unknown="$(grep -E '^// @' "$source" | grep -vE '^// @(exit|stdout|stderr-contains) ')"; then
              echo "$source carries a directive this job does not check:"
              echo "$unknown"
              status=1
              continue
            fi
            expected_exit="$(sed -n 's|^// @exit ||p' "$source")"
            expected_stdout="$(sed -n 's|^// @stdout ||p' "$source")"
            for host in programs/programs-*; do
              exe="$host/$program-${{ matrix.target }}${{ matrix.suffix }}"
              label="$program built on ${host#programs/programs-}"
              chmod +x "$exe"
              set +e
              "$exe" > stdout.txt 2> stderr.txt
              code=$?
              set -e
              if [ "$code" != "$expected_exit" ]; then
                echo "$label exited $code, expected $expected_exit:"
                cat stderr.txt
                status=1
              fi
              if [ "$(tr -d '\r' < stdout.txt)" != "$expected_stdout" ]; then
                echo "$label printed:"
                cat stdout.txt
                echo "expected:"
                echo "$expected_stdout"
                status=1
              fi
              while IFS= read -r fragment; do
                if [ -n "$fragment" ] && ! grep -qF -- "$fragment" stderr.txt; then
                  echo "$label did not report '$fragment':"
                  cat stderr.txt
                  status=1
                fi
              done <<<"$(sed -n 's|^// @stderr-contains ||p' "$source")"
            done
            echo "$program runs on ${{ matrix.target }} as built on every host"
          done
          exit $status
